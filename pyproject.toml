[project]
name = "quantpublisher"
version = "0.1.0"
description = "Personal quant data / analysis / publishing pipeline running on a single Mac mini"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quantpublisher"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
